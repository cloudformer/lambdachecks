<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400"
     font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <style>
      .box   { stroke-width: 1.5; rx: 10; }
      .title { font-size: 15px; font-weight: 600; fill: #0F172A; }
      .sub   { font-size: 12px; fill: #334155; }
      .note  { font-size: 12px; fill: #64748B; }
      .edge  { fill: none; stroke: #64748B; stroke-width: 1.8; }
      .later { stroke-dasharray: 6 5; }
    </style>
  </defs>
  <rect width="1000" height="400" fill="#FFFFFF"/>

  <!-- callers -->
  <rect class="box" x="30" y="60" width="200" height="110" fill="#F1F5F9" stroke="#94A3B8"/>
  <text class="title" x="50" y="92">Your browser</text>
  <text class="sub" x="50" y="114">Healthchecks UI, API</text>
  <text class="title" x="50" y="144">Your cron jobs</text>
  <text class="sub" x="50" y="162">curl &lt;url&gt;/ping/&lt;uuid&gt;</text>

  <!-- web lambda -->
  <rect class="box" x="320" y="50" width="280" height="130" fill="#FFF4EB" stroke="#F58534"/>
  <text class="title" x="340" y="82">Function URL → Lambda</text>
  <text class="sub" x="340" y="106">Healthchecks v5.0.3, unchanged</text>
  <text class="sub" x="340" y="126">WSGI adapter · whitenoise static files</text>
  <text class="note" x="340" y="160">per request · ≈ $0 idle</text>

  <!-- manage -->
  <rect class="box" x="320" y="220" width="280" height="70" fill="#FFF4EB" stroke="#F58534"/>
  <text class="title" x="340" y="248">manage Lambda (no URL)</text>
  <text class="sub" x="340" y="270">migrate · createsuperuser (aws lambda invoke)</text>

  <!-- alerts, later -->
  <rect class="box later" x="320" y="315" width="280" height="60" fill="#FFFFFF" stroke="#F58534"/>
  <text class="title" x="340" y="341">EventBridge → alerts Lambda</text>
  <text class="note" x="340" y="361">sendalerts once a minute · later version</text>

  <!-- s3rds, in the same stack -->
  <rect class="box" x="680" y="40" width="300" height="270" fill="#EEF7E8" stroke="#3F8624"/>
  <text class="title" x="700" y="68">s3rds v0.2.1 (same stack)</text>
  <rect class="box" x="700" y="84" width="260" height="96" fill="#FFF4EB" stroke="#F58534"/>
  <text class="title" x="716" y="108">Function URL → db Lambda</text>
  <text class="sub" x="716" y="128">one writer · console at db_url</text>
  <text class="sub" x="716" y="148">ENGINE "s3rds.sqlite" over HTTPS</text>
  <text class="note" x="716" y="168">generated user / password</text>
  <rect class="box" x="700" y="200" width="260" height="90" fill="#FFFFFF" stroke="#3F8624"/>
  <text class="title" x="716" y="224">S3 bucket (private)</text>
  <text class="sub" x="716" y="246">db/healthchecks.sqlite</text>
  <text class="sub" x="716" y="266">every write = one upload, durable</text>
  <text class="note" x="716" y="284">≈ $0 idle (storage cents)</text>
  <path class="edge" d="M830,180 L830,198" marker-end="url(#arrow)"/>

  <path class="edge" d="M230,115 L318,115" marker-end="url(#arrow)"/>
  <path class="edge" d="M600,115 L698,115" marker-end="url(#arrow)"/>
  <path class="edge" d="M600,255 L640,255 L640,140 L698,140" marker-end="url(#arrow)"/>
  <path class="edge later" d="M600,345 L660,345 L660,160 L698,160" marker-end="url(#arrow)"/>
</svg>
